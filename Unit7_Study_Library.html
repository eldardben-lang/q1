  .card p{color:#54607a; font-size:13.5px; line-height:1.55; margin:0 0 10px;}
  .card ul{list-style:none; margin:0 0 4px; padding:0;}
  .card li{
    color:#54607a; font-size:13.5px; line-height:1.55; margin-bottom:7px;
    padding-left:18px; position:relative;
  }
  .card li::before{content:"›"; position:absolute; left:0; top:0; color:var(--cyan); font-weight:700;}

  .quiz-banner{
    background:var(--cyan-light); border:1px solid #bfe8fb; border-radius:12px; padding:14px 16px;

  @media (min-width:600px){
    .lesson-tab{font-size:13px; padding:12px 4px;}

</style>

  } else {
    container.innerHTML = renderQuizHtml(currentLesson);
    attachQuizHandlers(currentLesson);
  }
}

function renderReadHtml(lesson){
  return lesson.sections.map(sec => `
    <div class="card">
      <h3>${esc(sec.heading)}</h3>
      ${sec.blocks.map(b => {
        if(b.type === "p"){
          return `<p>${esc(b.text)}</p>`;
        } else {
          return `<ul>${b.items.map(it => `<li>${esc(it)}</li>`).join("")}</ul>`;
        }
      }).join("")}
    </div>
  `).join("");
}

function renderQuizHtml(lessonIdx){
  const lesson = LESSONS[lessonIdx];
  const state = quizState[lessonIdx];
  const answered = state.answers.filter(a => a !== null).length;
  const allAnswered = answered === lesson.quiz.length;
  const score = state.submitted
    ? lesson.quiz.reduce((s,q,i) => s + (state.answers[i] === q.correct ? 1 : 0), 0)
    : 0;

  let html = `
    <div class="quiz-banner">
      <div>
        <p class="t1">Practice Quiz</p>
        <p class="t2">Untimed, unlimited attempts — just for your own revision.</p>
      </div>
      ${state.submitted ? `<div class="score">${score}/${lesson.quiz.length}</div>` : ""}
    </div>
  `;

  lesson.quiz.forEach((q, qi) => {
    html += `<div class="q-card">
      <p class="q-text"><span class="qn">${qi+1}.</span>${esc(q.q)}</p>`;
    q.options.forEach((opt, oi) => {
      let cls = "opt";
      const selected = state.answers[qi] === oi;
      if(state.submitted && oi === q.correct) cls += " correct";
      else if(state.submitted && selected && oi !== q.correct) cls += " wrong";
      else if(!state.submitted && selected) cls += " selected";
      html += `<button class="${cls}" data-q="${qi}" data-o="${oi}" ${state.submitted?"disabled":""}>${esc(opt)}</button>`;
    });
    if(state.submitted){
      const isCorrect = state.answers[qi] === q.correct;
      html += `<p class="explain"><span class="mark ${isCorrect?'ok':'no'}">${isCorrect?'✓':'✕'}</span>${esc(q.explanation)}</p>`;
    }
    html += `</div>`;
  });

  if(!state.submitted){
    html += `<button class="btn-primary" id="checkBtn" ${allAnswered?"":"disabled"}>
      ${allAnswered ? "Check My Answers" : `Answer all ${lesson.quiz.length} questions`}
    </button>`;
  } else {
    html += `<button class="btn-secondary" id="retryBtn">↺ Try Again</button>`;
  }

  return html;
}

function attachQuizHandlers(lessonIdx){
  const state = quizState[lessonIdx];
  document.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      if(state.submitted) return;
      const qi = parseInt(btn.getAttribute("data-q"), 10);
      const oi = parseInt(btn.getAttribute("data-o"), 10);
      state.answers[qi] = oi;
      renderContent();
    });
  });
  const checkBtn = document.getElementById("checkBtn");
  if(checkBtn){
    checkBtn.addEventListener("click", () => {
      state.submitted = true;
      renderContent();
    });
  }
  const retryBtn = document.getElementById("retryBtn");
  if(retryBtn){
    retryBtn.addEventListener("click", () => {
      state.answers = Array(LESSONS[lessonIdx].quiz.length).fill(null);
      state.submitted = false;
      renderContent();
    });
  }
}

/* =========================================================
   ACTIONS
   ========================================================= */
function selectLesson(i){
  currentLesson = i;
  currentTab = "read";
  renderAll();
}
function selectTab(t){
  currentTab = t;
  renderAll();
}
function renderAll(){
  renderLessonTabs();
  renderLessonInfo();
  renderSubTabs();
  renderContent();
  window.scrollTo({top:0, behavior:"instant"});
}

renderAll();
</script>
